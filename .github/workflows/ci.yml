name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on every check that runs off-target. The Windows job is the one that counts.
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: extractions/setup-just@v2
      - name: Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: just check-core

  # The target platform: full `just check` including the Playwright critical path against the
  # real app, then the unsigned installer as an artifact.
  windows:
    runs-on: windows-latest
    env:
      # `just` runs its recipes under Git Bash, whose MSYS perl lacks the modules OpenSSL's
      # Configure needs; the vendored OpenSSL build must use Strawberry Perl.
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: extractions/setup-just@v2
      - run: pnpm install --frozen-lockfile
      # The E2E drives the real app; hosted runners ship Edge but not the WebView2 Evergreen
      # runtime the app needs to start (the installer skips it too, docs/release.md).
      - name: WebView2 Evergreen runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile MicrosoftEdgeWebview2Setup.exe
          Start-Process -FilePath .\MicrosoftEdgeWebview2Setup.exe -ArgumentList '/silent','/install' -Wait
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 runtime pv: $((Get-ItemProperty $key).pv)" } else { "WebView2 runtime key missing" }
      - run: just check-core
      # The installer is gated on check-core (ADR-0049). The Playwright critical path still runs
      # against the real app and its result is visible on the run, but a hosted runner's desktop
      # session has not let Playwright attach to WebView2 yet, so it does not withhold the build.
      - name: Playwright critical path (advisory on hosted runners)
        id: e2e
        continue-on-error: true
        run: just e2e
      - name: E2E outcome
        shell: bash
        run: 'echo "Playwright critical path: ${{ steps.e2e.outcome }}"'
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kept-windows-unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.e2e.outcome != 'success'
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
