[package]
name = "kept"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Kept: a local-only, encrypted cash cockpit"
publish = false

[lib]
name = "kept"
path = "src/lib.rs"

[[bin]]
name = "kept"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
# `app` pulls in the Tauri runtime. Engines, the database layer and every test build without it
# (`cargo test --no-default-features`) so money math can be verified on a host without a webview.
app = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sha2 = "0.11"
hex = "0.4"
zeroize = "1"
# Credential store (optional "remember passphrase"): keyring-core API + one platform store.
# The `keyring` facade is not used: it requires its `v1`/`cli` feature sets and pulls stores we
# do not want (see its lib.rs). Windows Credential Manager is the shipping store.
keyring-core = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
